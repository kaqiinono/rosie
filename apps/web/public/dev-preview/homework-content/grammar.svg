<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 600"><rect width="450" height="600" fill="#fff6e5"/><g font-family="sans-serif" fill="#292524"><text x="30" y="60" font-size="28" font-weight="bold">am / is / are</text><text x="30" y="94" font-size="14">Original grammar demo page</text><text x="30" y="160" font-size="22">I am Rosie.</text><text x="30" y="205" font-size="22">She is my friend.</text><text x="30" y="250" font-size="22">They are students.</text><path d="M30 290H420M30 350H420M30 410H420M30 470H420M190 290V470" stroke="#a8a29e" stroke-width="2"/><g font-size="20"><text x="50" y="330">I</text><text x="220" y="330">am</text><text x="50" y="390">He / She / It</text><text x="220" y="390">is</text><text x="50" y="450">You / We / They</text><text x="220" y="450">are</text></g><text x="30" y="550" font-size="14">Read. Say. Try a sentence.</text></g></svg>
