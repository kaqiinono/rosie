name: CI

# Minimal gate: type-check + unit tests on every PR and on pushes to master.
# Kept deliberately small (no full `next build`, no lint) so it stays fast and
# rarely-red. Build is still run manually before releases per CLAUDE.md.
on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Enforces the acyclic package DAG (CLAUDE.md). Guards the @rosie/math split.
      - name: Package cycle check
        run: node scripts/check-package-cycles.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
